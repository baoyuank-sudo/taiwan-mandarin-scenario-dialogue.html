body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text-main);margin:0;padding:16px;display:flex;justify-content:center}
.container{max-width:960px;width:100%}
header{text-align:center;margin-bottom:16px}

.pyramid-level{margin-bottom:10px}
.pyramid-title{font-weight:bold;color:var(--primary);margin-bottom:8px;font-size:.95rem}
.tag-group{display:flex;flex-wrap:wrap;gap:7px}
.scene-tag,.sub-tag{background:var(--primary-light);color:var(--primary);padding:6px 12px;border-radius:20px;font-size:.88rem;cursor:pointer;border:1px solid transparent;transition:all .2s;user-select:none}
.scene-tag:hover,.scene-tag.active,.sub-tag:hover,.sub-tag.active{background:var(--primary);color:#fff}
.sub-nav{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:none}
.sub-nav.show{display:block}
.sub-title{font-size:.85rem;color:var(--text-sub);margin-bottom:8px}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--primary-light);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:1.2rem;font-weight:bold;color:var(--primary)}
.dialogue-item{margin-bottom:10px;padding:10px;background:#FAFAFA;border-left:4px solid var(--primary);border-radius:4px}
.dialogue-zh{font-size:1.05rem;font-weight:bold;color:var(--text-main);display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.dialogue-en{font-size:.9rem;color:var(--text-sub);font-style:italic;margin-top:3px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:.85rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:var(--secondary)}.btn-accent{background:var(--accent)}
.grammar-box{background:#FFFBEB;border:1px solid #FFE58F;padding:12px;border-radius:10px;margin-bottom:10px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.vocab-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;cursor:pointer;transition:all .2s}
.vocab-card:hover{border-color:var(--primary);background:var(--primary-light)}
.vocab-zh{font-weight:bold;font-size:1rem}.vocab-pinyin{color:var(--primary);font-size:.82rem}.vocab-en{color:var(--text-sub);font-size:.78rem}
.q-box{background:#F8F9FA;padding:12px;border-radius:10px;margin-bottom:10px}
input[type=text]{width:100%;padding:9px;margin-top:6px;border:1px solid #CCC;border-radius:8px;box-sizing:border-box}
.coming-soon{text-align:center;padding:36px 16px;color:var(--text-sub);font-size:1.05rem}
.coming-soon strong{color:var(--accent);display:block;margin-bottom:6px;font-size:1.2rem}

<span class="scene-tag" data-main="dining" onclick="selectMain('dining',this)">🍽 飲食與餐廳</span>
<span class="scene-tag" data-main="transport" onclick="selectMain('transport',this)">🚗 交通與旅遊</span>

<span class="scene-tag" data-main="medical" onclick="selectMain('medical',this)">🏥 醫療與公共服務</span>

<div id="dialogueList"></div>

dorm_meet:{title:"🏢 室友初次見面 (TOCFL A1-A2)",
dialogues:[
{zh:"A：嗨！你是新來的室友嗎？我叫小美。",en:"A: Hi! Are you the new roommate? I'm Xiaomei."},
{zh:"B：對啊，我叫阿明，從馬來西亞來的。請多指教！",en:"B: Yes, I'm Amin, from Malaysia. Nice to meet you!"},
{zh:"A：歡迎！你的家鄉有什麼好吃的？",en:"A: Welcome! What good food is there in your hometown?"},
{zh:"B：我們那邊的椰漿飯很有名，超香的。",en:"B: Our nasi lemak is famous, super fragrant."},
{zh:"A：聽起來好棒！台灣的夜市你一定要去吃。",en:"A: Sounds great! You must try Taiwan's night markets."},
{zh:"B：好啊！你住這裡多久了？",en:"B: Sure! How long have you lived here?"},
{zh:"A：我已經住一年了，有問題都可以問我。",en:"A: I've lived here for a year. Feel free to ask me anything."},
{zh:"B：太好了，謝謝你！晚上要不要一起吃晚餐？",en:"B: Great, thanks! Want to have dinner together tonight?"},
{zh:"A：好啊，我知道附近有一家超好吃的滷肉飯。",en:"A: Yeah, I know a super good braised pork rice place nearby."},
{zh:"B：那太完美了，晚上見！",en:"B: Perfect, see you tonight!"}
],

dorm_rules:{title:"🏢 制定住宿公約 (TOCFL A1-A2)",
dialogues:[
{zh:"A：我們來訂一下宿舍公約好不好？",en:"A: Shall we set some dorm rules?"},
{zh:"B：好啊，先從冷氣開始吧。",en:"B: Sure, let's start with the air-con."},
{zh:"A：冷氣晚上十一點前可以開，之後就關，省電費。",en:"A: A/C can be on until 11 p.m., then off to save electricity."},
{zh:"B：可以。那垃圾呢？輪流丟好了。",en:"B: Okay. What about trash? Let's take turns."},
{zh:"A：每週一三五我丟，二四六你丟，可以嗎？",en:"A: I take Mon/Wed/Fri, you take Tue/Thu/Sat, okay?"},
{zh:"B：沒問題。公共區域要保持乾淨喔。",en:"B: No problem. Keep the common area clean."},
{zh:"A：對，洗完澡要把地板擦乾。",en:"A: Yes, wipe the floor dry after showering."},
{zh:"B：還有，晚上十二點後小聲一點，不要影響別人睡覺。",en:"B: Also, after midnight keep the volume down so others can sleep."},
{zh:"A：好，我們把這些寫在紙上貼起來。",en:"A: Okay, let's write these down and put them up."},
{zh:"B：太好了，這樣大家比較好相處。",en:"B: Great, this way everyone gets along better."}
],

{title:"1. ……好不好？ (hǎo bu hǎo?)",desc:"<strong>使用原則：</strong>徵求同意的口語說法，語氣友善。",example:"例句：我們來訂公約<strong>好不好</strong>？"},

dorm_laundry:{title:"🏢 宿舍洗衣服 (TOCFL A1-A2)",
dialogues:[
{zh:"A：不好意思，可以借一下洗衣精嗎？我的用完了。",en:"A: Excuse me, can I borrow some detergent? Mine is finished."},
{zh:"B：可以啊，在洗手台旁邊，你自己拿。",en:"B: Sure, it's by the sink, just take it."},
{zh:"A：謝謝！對了，洗衣機好像壞掉了。",en:"A: Thanks! By the way, the washing machine seems broken."},
{zh:"B：真的嗎？我剛剛也洗不了。",en:"B: Really? I couldn't use it either just now."},
{zh:"A：要向誰報修啊？",en:"A: Who should we report it to?"},
{zh:"B：跟宿管說就好，他會叫人來修。",en:"B: Just tell the dorm manager, he'll call someone to fix it."},
{zh:"A：宿管辦公室在幾樓？",en:"A: Which floor is the dorm office on?"},
{zh:"B：一樓進門左邊。你要現在去嗎？",en:"B: First floor, left after the entrance. Going now?"},
{zh:"A：對，我先去報修，謝謝你！",en:"A: Yes, I'll go report it first. Thanks!"},
{zh:"B：不客氣，修好了再一起洗衣服。",en:"B: You're welcome. Let's do laundry together after it's fixed."}
],

campus_group:{title:"🏫 分組報告找組員 (TOCFL A1-A2)",
dialogues:[
{zh:"A：請問這組還缺人嗎？我想加入。",en:"A: Excuse me, does this group still need people? I'd like to join."},
{zh:"B：還缺一位，你是哪個系的？",en:"B: We still need one. Which department are you from?"},
{zh:"A：我是應華系的，華語是我的強項。",en:"A: I'm from Applied Chinese. Chinese is my strength."},
{zh:"B：太好了！我們正好需要會華語的人。",en:"B: Perfect! We just need someone good at Chinese."},
{zh:"A：那我可以負責資料蒐集和簡報。",en:"A: Then I can handle research and the presentation."},
{zh:"B：好啊，我們交換 LINE 吧。",en:"B: Sure, let's exchange LINE."},
{zh:"A：這是我的 QR Code，你掃一下。",en:"A: Here's my QR code, scan it."},
{zh:"B：加到了。我們什麼時候討論主題？",en:"B: Added. When shall we discuss the topic?"},
{zh:"A：明天下午兩點，圖書館一樓可以嗎？",en:"A: Tomorrow 2 p.m. at the library first floor, okay?"},
{zh:"B：可以，到時候見！",en:"B: Okay, see you then!"}
],

campus_library:{title:"🏫 圖書館搶座位 (TOCFL A1-A2)",
dialogues:[
{zh:"A：這裡有插座嗎？我筆電快沒電了。",en:"A: Is there a power outlet here? My laptop is almost dead."},
{zh:"B：有，在桌子下面，你看。",en:"B: Yes, under the table, look."},
{zh:"A：太好了！這個位子可以坐嗎？",en:"A: Great! Can I sit here?"},
{zh:"B：可以，我朋友剛走。",en:"B: Sure, my friend just left."},
{zh:"A：謝謝。不好意思，可以幫我看一下東西嗎？我去一下洗手間。",en:"A: Thanks. Can you watch my stuff? I need the restroom."},
{zh:"B：沒問題，你去吧。",en:"B: No problem, go ahead."},
{zh:"A：（回來）謝謝你。這裡通常都滿嗎？",en:"A: (returns) Thanks. Is it usually full here?"},
{zh:"B：期末考前超滿，要早一點來才有位子。",en:"B: Super full before finals, come early."},
{zh:"A：原來如此。你也在準備考試嗎？",en:"A: I see. Preparing for exams too?"},
{zh:"B：對啊，一起加油！",en:"B: Yeah, let's work hard together!"}
],

social_cafeteria:{title:"🍔 學生餐廳吃午餐 (TOCFL A1-A2)",
dialogues:[
{zh:"A：中午要吃什麼？人好多喔。",en:"A: What shall we eat? So many people."},
{zh:"B：我想吃排骨飯，你呢？",en:"B: I want pork rib rice. How about you?"},
{zh:"A：我吃牛肉麵好了。要不要我去排隊，你佔位子？",en:"A: I'll have beef noodle. Shall I queue while you save seats?"},
{zh:"B：好啊，那我先去那邊坐。",en:"B: Okay, I'll go sit over there."},
{zh:"A：（排隊後）排骨飯跟牛肉麵都好了，還有湯。",en:"A: (after queue) Both ready, plus soup."},
{zh:"B：謝謝！今天的排骨好大一塊。",en:"B: Thanks! The rib is huge today."},
{zh:"A：對啊，超划算。你下午有課嗎？",en:"A: Yeah, super worth it. Class this afternoon?"},
{zh:"B：有，兩點的英文課。你要一起走嗎？",en:"B: Yes, English at 2. Walk together?"},
{zh:"A：好，吃完再走。這湯可以續嗎？",en:"A: Sure. Can we refill the soup?"},
{zh:"B：可以，去那邊自己裝就好。",en:"B: Yes, just fill it yourself over there."}
],

social_club:{title:"🍔 加入社團博覽會 (TOCFL A1-A2)",
dialogues:[
{zh:"A：學長好，請問這是什麼社團？",en:"A: Hello senior, what club is this?"},
{zh:"B：我們是熱音社，每週有社課練團。",en:"B: Hot Music Club. We practice every week."},
{zh:"A：聽起來很有趣！社課在哪裡？",en:"A: Sounds fun! Where are the classes?"},
{zh:"B：在學生活動中心三樓，晚上七點到九點。",en:"B: Student Activity Center 3F, 7 to 9 p.m."},
{zh:"A：會不會很難？我是新手。",en:"A: Is it hard? I'm a beginner."},
{zh:"B：不會，我們有教學，慢慢學就好。",en:"B: No, we teach. Just learn step by step."},
{zh:"A：那我可以加入嗎？要填什麼？",en:"A: Can I join? What do I fill out?"},
{zh:"B：填這張入會單就好，再加我們的社團 LINE。",en:"B: Just this membership form and join our LINE."},
{zh:"A：好的，我現在填。謝謝學長！",en:"A: Okay, filling now. Thanks!"},
{zh:"B：歡迎加入！下週社課見。",en:"B: Welcome! See you next week."}
],

shop_tea:{title:"🥤 手搖飲料店 (TOCFL A2-B1)",
dialogues:[
{zh:"店員：你好！請問今天想喝什麼？",en:"Clerk: Hello! What would you like today?"},
{zh:"顧客：我要一杯珍珠奶茶，請問有推薦的甜度嗎？",en:"Customer: A boba milk tea. Any recommended sweetness?"},
{zh:"店員：我們的珍珠本身有甜味，建議點微糖就好。",en:"Clerk: Our boba is already sweet, I recommend slight sweetness."},
{zh:"顧客：好，那就微糖、少冰，謝謝。",en:"Customer: Okay, slight sweetness and less ice, thanks."},
{zh:"店員：需要加其他配料嗎？椰果或仙草都可以。",en:"Clerk: Any toppings? Coconut jelly or grass jelly?"},
{zh:"顧客：不用了，這樣就好。另外再一杯熱的黑糖鮮奶。",en:"Customer: No thanks. Also one hot brown sugar fresh milk."},
{zh:"店員：黑糖鮮奶甜度是固定的喔，一共120元。",en:"Clerk: Fixed sweetness. Total 120 NTD."},
{zh:"顧客：可以行動支付嗎？發票幫我存載具。",en:"Customer: Mobile payment? Save invoice to my carrier."},
{zh:"店員：可以，請掃這邊的QR Code。",en:"Clerk: Sure, scan this QR code."},
{zh:"顧客：好了，謝謝！",en:"Customer: Done, thanks!"}
],

shop_market:{title:"🛒 菜市場買菜 (TOCFL A2-B1)",
dialogues:[
{zh:"老闆：小姐，要買什麼？青菜很新鮮喔！",en:"Vendor: Miss, what would you like? Greens are fresh!"},
{zh:"顧客：小白菜怎麼賣？",en:"Customer: How much is the bok choy?"},
{zh:"老闆：一斤三十，今天特價二十五。",en:"Vendor: 30 per jin, special 25 today."},
{zh:"顧客：那給我半斤，再兩顆番茄。",en:"Customer: Half a jin, plus two tomatoes."},
{zh:"老闆：番茄很甜，三顆五十比較划算。",en:"Vendor: Tomatoes are sweet, three for 50 is better."},
{zh:"顧客：好，三顆。有雞蛋嗎？",en:"Customer: Okay, three. Do you have eggs?"},
{zh:"老闆：有，一盒十顆六十元。",en:"Vendor: Yes, box of ten for 60."},
{zh:"顧客：好。全部多少？",en:"Customer: Okay. How much total?"},
{zh:"老闆：青菜十二點五、番茄五十、蛋六十，一共一百二十二點五，算你一百二十。",en:"Vendor: 12.5 + 50 + 60 = 122.5, make it 120."},
{zh:"顧客：謝謝老闆，找你一百五。",en:"Customer: Thanks, here's 150."}
],

dialogues:[
{zh:"店員：您好，請問需要什麼？",en:"Clerk: Hello, what do you need?"},
{zh:"顧客：我要取網購的包裹，這是條碼。",en:"Customer: Picking up an online package. Here's the barcode."},
{zh:"店員：好的，請稍等……找到了，請簽名。",en:"Clerk: One moment... Found it, please sign."},

{zh:"店員：好，在這邊。還要繳電話費嗎？",en:"Clerk: Okay. Paying phone bill too?"},
{zh:"顧客：不用。水我自己拿。可以用載具嗎？",en:"Customer: No. I'll get water. Can I use the carrier?"},
{zh:"店員：可以，請出示載具條碼。一共85元。",en:"Clerk: Yes, show the barcode. Total 85."},
{zh:"顧客：行動支付，謝謝！",en:"Customer: Mobile payment, thanks!"}
],

trans_taxi:{title:"🚗 搭乘計程車 (TOCFL A2-B1)",

{zh:"司機：你好，要去哪裡？",en:"Driver: Hello, where to?"},
{zh:"乘客：麻煩到台北車站，謝謝。",en:"Passenger: Taipei Main Station, please."},
{zh:"司機：好。現在有點塞，大概三十分鐘。",en:"Driver: Okay. A bit congested, about 30 minutes."},
{zh:"乘客：沒關係。可以走地下道那條路嗎？比較快。",en:"Passenger: No problem. Underpass route? Faster."},
{zh:"司機：可以。要開冷氣嗎？",en:"Driver: Sure. A/C on?"},
{zh:"乘客：好，謝謝。到了請從東三門。",en:"Passenger: Yes. Drop me at East Exit 3."},
{zh:"司機：好的。您是觀光還是出差？",en:"Driver: Okay. Sightseeing or business?"},
{zh:"乘客：來念書的。到了嗎？",en:"Passenger: Studying here. Are we there?"},
{zh:"司機：到了，一共250元。要發票嗎？",en:"Driver: Here, 250 NTD. Need receipt?"},
{zh:"乘客：要，謝謝。這裡300，不用找了。",en:"Passenger: Yes. Here's 300, keep the change."}

let currentMain = "shopping";
let currentData = null;

function selectMain(mainKey, el) {
    currentMain = mainKey;
    document.querySelectorAll(".scene-tag").forEach(t => t.classList.remove("active"));
    if (el) el.classList.add("active");
    else {
        const t = document.querySelector(`.scene-tag[data-main="${mainKey}"]`);
        if (t) t.classList.add("active");
    }
    const cat = mainCategories[mainKey];
    const subNav = document.getElementById("subNav");
    const subTags = document.getElementById("subTags");
    const subTitle = document.getElementById("subTitle");
    subNav.classList.add("show");
    subTitle.textContent = cat.label + " — 請選擇子場景：";
    subTags.innerHTML = "";
    cat.subs.forEach((s, idx) => {
        const span = document.createElement("span");
        span.className = "sub-tag" + (idx === 0 ? " active" : "");
        span.textContent = s.label;
        span.onclick = function () { selectSub(s.key, this); };
        subTags.appendChild(span);
    });
    if (cat.subs.length) selectSub(cat.subs[0].key);
}

function selectSub(key, el) {
    document.querySelectorAll(".sub-tag").forEach(t => t.classList.remove("active"));
    if (el) el.classList.add("active");
    if (modules[key]) loadModule(modules[key]);
    else showComingSoon(key);
}

function loadModule(data) {
    currentData = data;
    document.getElementById("moduleTitle").textContent = data.title;
    const dialogueList = document.getElementById("dialogueList");
    dialogueList.innerHTML = "";
    data.dialogues.forEach(d => {
        const div = document.createElement("div");
        div.className = "dialogue-item";
        const safe = d.zh.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        div.innerHTML = `<div class="dialogue-zh" onclick="speakText('${safe}')"><span>${d.zh}</span><span style="color:var(--primary);font-size:0.9rem;">🔊</span></div><div class="dialogue-en">${d.en}</div>`;
        dialogueList.appendChild(div);
    });
    const grammarList = document.getElementById("grammarList");
    grammarList.innerHTML = "";
    data.grammar.forEach(g => {
        const div = document.createElement("div");
        div.className = "grammar-box";
        div.innerHTML = `<div style="font-weight:bold;color:var(--accent);font-size:1.02rem;margin-bottom:4px;">${g.title}</div><div>${g.desc}</div><div style="color:var(--text-sub);font-size:0.88rem;margin-top:4px;">${g.example}</div>`;
        grammarList.appendChild(div);
    });
    document.getElementById("mindmapNote").innerHTML = data.mindmap;
    const vocabGrid = document.getElementById("vocabGrid");
    vocabGrid.innerHTML = "";
    data.vocab.forEach(v => {
        const div = document.createElement("div");
        div.className = "vocab-card";
        div.onclick = () => speakText(v.zh);
        div.innerHTML = `<div class="vocab-zh">${v.zh} 🔊</div><div class="vocab-pinyin">${v.pinyin}</div><div class="vocab-en">${v.en}</div>`;
        vocabGrid.appendChild(div);
    });
    const quizList = document.getElementById("quizList");
    quizList.innerHTML = "";
    data.questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "q-box";
        const safeQ = q.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        div.innerHTML = `<div style="font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><span>${q}</span><button class="btn" style="padding:2px 8px;font-size:0.78rem;flex-shrink:0;" onclick="speakText('${safeQ}')">🔊 聽題目</button></div><input type="text" placeholder="請用中文寫下答案...">`;
        quizList.appendChild(div);
    });
    document.getElementById("btnFullDialogue").style.display = "inline-flex";
    document.getElementById("btnVocab").style.display = "inline-flex";
}

function showComingSoon(key) {
    currentData = null;
    document.getElementById("moduleTitle").textContent = "內容準備中";
    document.getElementById("dialogueList").innerHTML = `<div class="coming-soon"><strong>🚧 此子場景內容開發中</strong>目前已完成多個代表性場景，其餘將陸續補上。<br>請先練習其他已開放的子場景！</div>`;
    document.getElementById("grammarList").innerHTML = "";
    document.getElementById("mindmapNote").innerHTML = "";
    document.getElementById("vocabGrid").innerHTML = "";
    document.getElementById("quizList").innerHTML = "";
    document.getElementById("btnFullDialogue").style.display = "none";
    document.getElementById("btnVocab").style.display = "none";
}

function speakText(text) {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-TW";
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
    } else {
        alert("您的瀏覽器不支援語音朗讀");
    }
}

function speakFullDialogue() {
    if (!currentData) return;
    let t = currentData.title + "。對話開始：\n";
    currentData.dialogues.forEach(d => { t += d.zh + "\n"; });
    speakText(t);
}

function speakVocabExplanation() {
    if (!currentData) return;
    let t = "現在解說生詞用法：\n";
    currentData.vocab.forEach((v, i) => { t += `第${i + 1}個，${v.zh}。${v.exp}\n`; });
    speakText(t);
}

window.onload = () => { selectMain("shopping"); };
</script>
